name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install libtool automake autoconf pkg-config texinfo libusb libftdi hidapi libjaylink

      - name: Bootstrap
        run: ./bootstrap nosubmodule

      - name: Configure
        run: ./configure --prefix=/usr/local

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test
        run: ./src/openocd --version

      - name: Stage install
        run: make install-strip DESTDIR="$(pwd)/stage"

      - name: Bundle Homebrew runtime libraries
        run: |
          mkdir -p stage/usr/local/lib
          BIN=stage/usr/local/bin/openocd
          # Copy every Homebrew-provided dylib openocd (transitively) depends on
          queue="$BIN"
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)/'); do
                base=$(basename "$dep")
                dest="stage/usr/local/lib/$base"
                if [ ! -f "$dest" ]; then
                  cp "$dep" "$dest"
                  chmod u+w "$dest"
                  next="$next $dest"
                fi
                install_name_tool -change "$dep" "@loader_path/../lib/$base" "$f"
              done
            done
            queue="$next"
          done
          codesign --force --sign - "$BIN"
          for f in stage/usr/local/lib/*.dylib; do
            [ -f "$f" ] || continue
            codesign --force --sign - "$f"
          done

      - name: Verify staged binary runs without external library help
        run: |
          cd stage/usr/local/bin
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH ./openocd --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-macos-arm64
          path: stage/usr/local

  linux:
    name: Linux (${{ matrix.arch }}, glibc 2.17)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Start build container
        run: |
          docker run -d --name build \
            -v "${{ github.workspace }}":/src -w /src \
            ${{ matrix.image }} \
            sleep infinity
          docker exec build git config --global --add safe.directory /src

      - name: Install build dependencies
        run: docker exec build bash .github/scripts/build-linux-deps.sh

      - name: Bootstrap
        run: docker exec build ./bootstrap nosubmodule

      - name: Configure
        run: |
          docker exec \
            -e PKG_CONFIG_PATH=/usr/local/lib/pkgconfig \
            -e LDFLAGS='-Wl,-rpath,$ORIGIN/../lib' \
            build ./configure --prefix=/usr/local

      - name: Build
        run: docker exec build bash -c 'make -j"$(nproc)"'

      - name: Smoke test
        run: docker exec -e LD_LIBRARY_PATH=/usr/local/lib build ./src/openocd --version

      - name: Stage install
        run: docker exec build bash -c 'make install-strip DESTDIR=/src/stage'

      - name: Bundle custom-built runtime libraries
        run: |
          docker exec build bash -c '
            set -e
            mkdir -p stage/usr/local/lib
            cp -a /usr/local/lib/libusb-1.0.so* stage/usr/local/lib/
            cp -a /usr/local/lib/libftdi1.so* stage/usr/local/lib/
            cp -a /usr/local/lib/libhidapi-hidraw.so* stage/usr/local/lib/
          '

      - name: Verify staged binary runs without external library help
        run: |
          docker exec build bash -c '
            set -e
            cd stage/usr/local/bin
            env -u LD_LIBRARY_PATH ./openocd --version
            readelf -d ./openocd | grep -E "R(UN)?PATH.*[\$]ORIGIN"
          '

      - name: Stop build container
        if: always()
        run: docker rm -f build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-linux-${{ matrix.arch }}
          path: stage/usr/local

  windows-x86_64:
    name: Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libusb-compat-git
            mingw-w64-x86_64-libftdi
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-pkg-config
            autoconf
            autoconf-archive
            automake
            automake-wrapper
            binutils
            gettext
            git
            libtool
            m4
            make
            tcl
            texinfo

      - name: Bootstrap
        run: ./bootstrap nosubmodule

      - name: Configure
        run: ./configure --prefix=/mingw64

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test
        run: ./src/openocd.exe --version

      - name: Stage install
        run: make install-strip DESTDIR="$(pwd)/stage"

      - name: Bundle runtime DLLs
        run: bash .github/scripts/bundle-mingw-dlls.sh "$(pwd)/stage/mingw64/bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows-x86_64
          path: stage/mingw64

  windows-arm64:
    name: Windows (arm64, cross-compiled, libusb only)
    runs-on: ubuntu-latest
    env:
      TRIPLE: aarch64-w64-mingw32
      SYSROOT: /tmp/arm64-sysroot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install cross-compile prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config texinfo

      - name: Install llvm-mingw
        run: |
          BIN_DIR=$(bash .github/scripts/setup-llvm-mingw.sh /tmp/llvm-mingw)
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Cross-build libusb-1.0
        run: bash .github/scripts/build-libusb-mingw-arm64.sh "$SYSROOT"

      - name: Bootstrap
        run: ./bootstrap nosubmodule

      - name: Configure
        run: |
          export PKG_CONFIG_LIBDIR="$SYSROOT/usr/lib/pkgconfig"
          export LIBUSB1_CFLAGS="-I$SYSROOT/usr/include/libusb-1.0"
          export LIBUSB1_LIBS="-L$SYSROOT/usr/lib -lusb-1.0"
          export CC="$TRIPLE-clang"
          ./configure --host="$TRIPLE" --prefix=/usr

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary architecture
        run: file src/openocd.exe | tee /dev/stderr | grep -q 'Aarch64'

      - name: Stage install
        run: make install-strip DESTDIR="$(pwd)/stage"

      - name: Bundle runtime DLLs
        run: |
          # llvm-mingw ships llvm-objdump; whether it also installs a
          # $TRIPLE-prefixed wrapper for it varies by release.
          OBJDUMP=$(command -v "$TRIPLE-objdump" || command -v llvm-objdump)
          SEARCH_DIRS="/tmp/llvm-mingw/$TRIPLE/bin $SYSROOT/usr/bin"
          for dll in $("$OBJDUMP" -p "$(pwd)/stage/usr/bin/openocd.exe" | awk '/DLL Name:/{print $3}'); do
            for dir in $SEARCH_DIRS; do
              if [ -f "$dir/$dll" ]; then
                cp -u "$dir/$dll" "$(pwd)/stage/usr/bin/"
                break
              fi
            done
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows-arm64
          path: stage/usr
