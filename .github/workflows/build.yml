name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_name:
        description: Name appended to the openocd --version output
        required: true
        type: string
      release_tag:
        description: Git tag used for the published GitHub Release
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_NAME: ${{ inputs.build_name || '' }}

jobs:
  test-publisher-client:
    name: Test package publisher client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/test-beget-release.py
      - run: bash .github/scripts/test-deploy-beget.sh

  macos-aarch64:
    name: macOS (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set build name
        run: .github/scripts/set-build-name.sh "$BUILD_NAME" src/openocd_build_name.h

      - name: Install dependencies
        run: |
          brew update
          brew install libtool automake autoconf pkg-config texinfo libusb libftdi hidapi libjaylink

      - name: Bootstrap
        run: ./bootstrap nosubmodule

      - name: Configure
        run: ./configure --prefix=/usr/local

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test build tree
        run: |
          set -euo pipefail

          version_output="$(./src/openocd --version 2>&1)"
          printf '%s\n' "$version_output"
          if [ -n "$BUILD_NAME" ]; then
            printf '%s\n' "$version_output" | grep -Fq "$BUILD_NAME"
          fi

          printf 'echo FILE_READ_OK\nshutdown\n' > read-test.cfg
          output="$(./src/openocd -f read-test.cfg 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq FILE_READ_OK
          if [ -n "$BUILD_NAME" ] && printf '%s\n' "$output" | grep -Fq "$BUILD_NAME"; then
            echo "BUILD_NAME unexpectedly appeared outside openocd --version" >&2
            exit 1
          fi
          rm -f read-test.cfg

      - name: Stage install
        run: |
          set -euo pipefail
          rm -rf stage dist
          make install-strip DESTDIR="$(pwd)/stage"

      - name: Bundle Homebrew runtime libraries
        run: |
          set -euo pipefail

          DEST="$(pwd)/stage/usr/local/bin"
          BIN="$DEST/openocd"
          queue="$BIN"

          while [ -n "$queue" ]; do
            next=""

            for file in $queue; do
              while read -r dependency; do
                [ -n "$dependency" ] || continue

                base="$(basename "$dependency")"
                bundled="$DEST/$base"

                if [ ! -f "$bundled" ]; then
                  cp "$dependency" "$bundled"
                  chmod u+w "$bundled"
                  next="$next $bundled"
                fi

                install_name_tool -change "$dependency" "@loader_path/$base" "$file"
              done < <(
                otool -L "$file" |
                  tail -n +2 |
                  awk '{print $1}' |
                  grep -E '^(/opt/homebrew|/usr/local)/' || true
              )
            done

            queue="$next"
          done

          for library in "$DEST"/*.dylib; do
            [ -f "$library" ] || continue
            codesign --force --sign - "$library"
          done
          codesign --force --sign - "$BIN"

      - name: Verify staged program
        run: |
          set -euo pipefail

          cd stage/usr/local/bin
          printf 'echo FILE_READ_OK\nshutdown\n' > read-test.cfg
          output="$(env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH ./openocd -f read-test.cfg 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq FILE_READ_OK
          rm -f read-test.cfg

      - name: Create release archives
        run: |
          .github/scripts/package-release.sh stage/usr/local dist openocd-macos-aarch64

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-macos-aarch64.tar.gz
          path: dist/openocd-macos-aarch64.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-macos-aarch64.zip
          path: dist/openocd-macos-aarch64.zip
          if-no-files-found: error
          compression-level: 0

  linux-x86_64:
    name: Linux (x86_64, glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set build name
        run: .github/scripts/set-build-name.sh "$BUILD_NAME" src/openocd_build_name.h

      - name: Start build container
        run: |
          docker run -d --name openocd-build -v "${{ github.workspace }}":/src -w /src quay.io/pypa/manylinux2014_x86_64 sleep infinity
          docker exec openocd-build git config --global --add safe.directory /src

      - name: Install build dependencies
        run: |
          docker exec openocd-build bash .github/scripts/build-linux-deps.sh

      - name: Test release helpers
        run: |
          docker exec openocd-build bash .github/scripts/test-package-release.sh
          docker exec openocd-build env -u LD_LIBRARY_PATH bash .github/scripts/test-linux-openocd-wrapper.sh
          docker exec openocd-build bash .github/scripts/test-set-build-name.sh
          docker exec openocd-build bash .github/scripts/test-release-files.sh

      - name: Bootstrap
        run: docker exec openocd-build ./bootstrap nosubmodule

      - name: Configure
        run: |
          docker exec -e PKG_CONFIG_PATH=/usr/local/lib/pkgconfig openocd-build ./configure --prefix=/usr/local

      - name: Build
        run: |
          docker exec openocd-build bash -c 'make -j"$(nproc)"'

      - name: Smoke test build tree
        run: |
          docker exec -e BUILD_NAME -e LD_LIBRARY_PATH=/usr/local/lib openocd-build bash -c '
              set -euo pipefail
              version_output="$(./src/openocd --version 2>&1)"
              printf "%s\n" "$version_output"
              if [ -n "$BUILD_NAME" ]; then
                printf "%s\n" "$version_output" | grep -Fq "$BUILD_NAME"
              fi

              printf "echo FILE_READ_OK\nshutdown\n" > read-test.cfg
              output="$(./src/openocd -f read-test.cfg 2>&1)"
              printf "%s\n" "$output"
              printf "%s\n" "$output" | grep -Fq FILE_READ_OK
              if [ -n "$BUILD_NAME" ] && printf "%s\n" "$output" | grep -Fq "$BUILD_NAME"; then
                echo "BUILD_NAME unexpectedly appeared outside openocd --version" >&2
                exit 1
              fi
              rm -f read-test.cfg
            '

      - name: Stage install
        run: |
          docker exec openocd-build bash -c '
            set -euo pipefail
            rm -rf stage dist
            make install-strip DESTDIR=/src/stage
          '

      - name: Bundle runtime libraries
        run: |
          docker exec openocd-build bash -c '
            set -euo pipefail

            DEST=stage/usr/local/bin
            mkdir -p "$DEST"

            for pattern in "/usr/local/lib/libusb-1.0.so*" "/usr/local/lib/libftdi1.so*" "/usr/local/lib/libhidapi-hidraw.so*" "/usr/local/lib/libjaylink.so*"
            do
              for library in $pattern; do
                [ -e "$library" ] || continue
                cp -L "$library" "$DEST/$(basename "$library")"
              done
            done

            rm -rf stage/usr/local/lib
            mv "$DEST/openocd" "$DEST/openocd.bin"
            cp .github/scripts/linux-openocd-wrapper.sh "$DEST/openocd"
            chmod +x "$DEST/openocd"
          '

      - name: Verify staged program
        run: |
          docker exec openocd-build bash -c '
            set -euo pipefail

            cd stage/usr/local/bin
            printf "echo FILE_READ_OK\nshutdown\n" > read-test.cfg
            output="$(env -u LD_LIBRARY_PATH ./openocd -f read-test.cfg 2>&1)"
            printf "%s\n" "$output"
            printf "%s\n" "$output" | grep -Fq FILE_READ_OK
            rm -f read-test.cfg
          '

      - name: Create release archives
        run: |
          docker exec openocd-build bash .github/scripts/package-release.sh stage/usr/local dist openocd-linux-x86_64

      - name: Stop build container
        if: always()
        run: docker rm -f openocd-build

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-linux-x86_64.tar.gz
          path: dist/openocd-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-linux-x86_64.zip
          path: dist/openocd-linux-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  windows-x86_64:
    name: Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Normalize line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: strict
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libftdi
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-libjaylink
            mingw-w64-ucrt-x86_64-pkgconf
            autoconf
            autoconf-archive
            automake
            automake-wrapper
            binutils
            gettext
            git
            libtool
            m4
            make
            texinfo
            zip

      - name: Set build name
        run: .github/scripts/set-build-name.sh "$BUILD_NAME" src/openocd_build_name.h

      - name: Bootstrap
        run: ./bootstrap nosubmodule

      - name: Configure release build
        run: |
          set -euo pipefail

          CFLAGS="-O2" CPPFLAGS="-D_FILE_OFFSET_BITS=64" ./configure --prefix=/ucrt64 --enable-internal-jimtcl

          grep -F -- '-D_FILE_OFFSET_BITS=64' jimtcl/Makefile

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test build tree
        run: |
          set -euo pipefail

          version_output="$(./src/openocd.exe --version 2>&1)"
          printf '%s\n' "$version_output"
          if [ -n "$BUILD_NAME" ]; then
            printf '%s\n' "$version_output" | grep -Fq "$BUILD_NAME"
          fi

          ./src/openocd.exe -c "shutdown"

          printf 'echo FILE_READ_OK\nshutdown\n' > read-test.cfg
          output="$(./src/openocd.exe -f read-test.cfg 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq FILE_READ_OK
          if [ -n "$BUILD_NAME" ] && printf '%s\n' "$output" | grep -Fq "$BUILD_NAME"; then
            echo "BUILD_NAME unexpectedly appeared outside openocd --version" >&2
            exit 1
          fi
          rm -f read-test.cfg

      - name: Stage install
        run: |
          set -euo pipefail
          rm -rf stage dist
          make install-strip DESTDIR="$(pwd)/stage"

      - name: Bundle runtime DLLs
        run: |
          set -euo pipefail

          DEST="$(pwd)/stage/ucrt64/bin"

          if [ ! -f "$DEST/openocd.exe" ]; then
            echo "openocd.exe not found in $DEST" >&2
            exit 1
          fi

          declare -a queue
          declare -A processed
          queue=("$DEST/openocd.exe")

          while [ "${#queue[@]}" -gt 0 ]; do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            file_key="$(cygpath -aw "$file" | tr '[:upper:]' '[:lower:]')"

            if [ -n "${processed[$file_key]+x}" ]; then
              continue
            fi
            processed["$file_key"]=1

            while read -r dll; do
              [ -n "$dll" ] || continue

              source_dll="$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)"

              # Missing from UCRT64 means this is normally a Windows
              # system DLL, such as KERNEL32.dll or ucrtbase.dll.
              if [ -z "$source_dll" ]; then
                continue
              fi

              bundled="$DEST/$(basename "$source_dll")"
              if [ ! -f "$bundled" ]; then
                cp "$source_dll" "$bundled"
              fi
              queue+=("$bundled")
            done < <(
              objdump -p "$file" |
                awk '/DLL Name:/{print $3}'
            )
          done

      - name: Verify staged program outside MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = Join-Path $PWD "stage\ucrt64\bin"
          $openocd = Join-Path $bin "openocd.exe"
          $cfg = Join-Path $bin "read-test.cfg"

          # The executable must resolve every bundled DLL without using
          # the MSYS2 installation that built it.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          $versionOutput = (& $openocd --version 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) {
              throw "openocd --version failed: $LASTEXITCODE"
          }
          Write-Output $versionOutput
          if ($env:BUILD_NAME -and -not $versionOutput.Contains($env:BUILD_NAME)) {
              throw "openocd --version does not contain BUILD_NAME"
          }

          & $openocd -c "shutdown"
          if ($LASTEXITCODE -ne 0) {
              throw "openocd -c shutdown failed: $LASTEXITCODE"
          }

          [System.IO.File]::WriteAllText(
              $cfg,
              "echo FILE_READ_OK`nshutdown`n",
              [System.Text.Encoding]::ASCII
          )

          Push-Location $bin
          try {
              $output = & .\openocd.exe -f .\read-test.cfg 2>&1
              $exitCode = $LASTEXITCODE
              $output | ForEach-Object { Write-Host $_ }

              if ($exitCode -ne 0) {
                  throw "openocd -f read-test.cfg failed: $exitCode"
              }
              if (($output -join "`n") -notmatch "FILE_READ_OK") {
                  throw "openocd did not execute read-test.cfg"
              }
              if ($env:BUILD_NAME -and ($output -join "`n").Contains($env:BUILD_NAME)) {
                  throw "BUILD_NAME unexpectedly appeared outside openocd --version"
              }
          }
          finally {
              Pop-Location
              Remove-Item $cfg -Force
          }

      - name: Create release archives
        run: |
          .github/scripts/package-release.sh stage/ucrt64 dist openocd-windows-x86_64

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows-x86_64.tar.gz
          path: dist/openocd-windows-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-windows-x86_64.zip
          path: dist/openocd-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs:
      - macos-aarch64
      - linux-x86_64
      - windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openocd-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        run: .github/scripts/verify-release-files.sh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "OpenOCD $RELEASE_TAG" --generate-notes --latest

  deploy-beget:
    name: Publish release to Beget
    if: github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openocd-*
          path: release-assets
          merge-multiple: true

      - name: Prepare Beget bundle
        run: >-
          python3 .github/scripts/prepare-beget-release.py
          --type openocd
          --tag "${{ inputs.release_tag }}"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --input release-assets
          --output beget-upload

      - name: Upload and publish on Beget
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy-beget-release.sh beget-upload
